services:
  localgov_elections.alias_manager:
    class: Drupal\localgov_elections\Service\ElectionAliasManager
    arguments: ['@entity_type.manager', '@path.validator', '@logger.channel.localgov_elections']
  localgov_elections.area_vote_form_helper:
    class: Drupal\localgov_elections\Form\AreaVoteFormHelper
  localgov_elections.election_duplicator:
    class: Drupal\localgov_elections\Service\ElectionDuplicator
    arguments: ['@entity_type.manager']
  localgov_elections.majority_calculator:
    class: Drupal\localgov_elections\Service\MajorityCalculator
    arguments: ['@entity_type.manager']
  localgov_elections.map_data_provider:
    class: Drupal\localgov_elections\Service\MapDataProvider
  localgov_elections.winner_calculator:
    class: Drupal\localgov_elections\Service\WinnerCalculator
    arguments: ['@entity_type.manager']
  logger.channel.localgov_elections:
    parent: logger.channel_base
    arguments: ['localgov_elections']
  plugin.manager.boundary_provider:
    class: Drupal\localgov_elections\BoundaryProviderPluginManager
    parent: default_plugin_manager
